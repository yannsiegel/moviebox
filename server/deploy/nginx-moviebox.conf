# Put these blocks into the server { } block of your existing site (HTTPS!),
# or into a new server block for e.g. movies.example.com.

# API + web player
location /api/ {
    proxy_pass http://127.0.0.1:3200;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # metadata scrapes and library scans can take a while
    proxy_read_timeout 300s;
    # uploads of own video files can be large
    client_max_body_size 20g;
    proxy_request_buffering off;
}

# Only reachable through X-Accel-Redirect from the Node server, after the token has been checked.
# Range requests work out of the box (nginx handles Range on static files), which is what the
# <video> element and ExoPlayer rely on for seeking.
location /_moviebox_media/ {
    internal;
    alias /srv/moviebox/media/;
    add_header Cache-Control "private, max-age=2592000";
}

# Transcoded HLS segments (one subfolder per media item, cleaned periodically).
location /_moviebox_hls/ {
    internal;
    alias /srv/moviebox/media/transcodes/;
    add_header Cache-Control "private, max-age=60";
}

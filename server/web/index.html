<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>MovieBox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #0b0d10; color: #e6e8eb; font: 15px system-ui, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #9aa0a6; margin: 0 0 24px; }
    form { display: grid; gap: 10px; }
    input { padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2f36; background: #11141a; color: inherit; font: inherit; }
    button { padding: 12px 14px; border-radius: 10px; border: 0; background: #e6e8eb; color: #0b0d10; font: inherit; font-weight: 600; cursor: pointer; }
    .err { color: #ff8e8e; min-height: 1.4em; margin: 8px 0 0; }
    .note { color: #6b7079; font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
<main>
  <h1>MovieBox</h1>
  <p>Anmelden</p>
  <form id="f">
    <input id="u" name="username" placeholder="Benutzername" autocomplete="username" required>
    <input id="p" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <button type="submit">Anmelden</button>
  </form>
  <div class="err" id="err"></div>
  <p class="note">Der Web-Player wird in einer späteren Version eingebaut. Diese Seite dient erst einmal nur dem Login-Test.</p>
</main>
<script>
const f = document.getElementById('f');
const err = document.getElementById('err');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  try {
    const body = JSON.stringify({ username: f.u.value, password: f.p.value, device: 'Web-Player' });
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Login fehlgeschlagen');
    sessionStorage.setItem('mb_token', data.token);
    err.style.color = '#8ef0a0';
    err.textContent = 'Angemeldet als ' + data.user.displayName + ' (Token im sessionStorage).';
  } catch (ex) {
    err.textContent = ex.message;
  }
});
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>MovieBox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar" hidden>
  <h1>MovieBox</h1>
  <nav>
    <button data-view="home" class="tab active">Start</button>
    <button data-view="movies" class="tab">Filme</button>
    <button data-view="shows" class="tab">Serien</button>
  </nav>
  <button id="scan-btn" title="Jetzt scannen">↻</button>
  <button id="logout-btn" title="Abmelden">⎋</button>
</header>

<main id="app">
  <section id="login">
    <h1>MovieBox</h1>
    <p>Anmelden</p>
    <form id="login-form">
      <input id="u" name="username" placeholder="Benutzername" autocomplete="username" required>
      <input id="p" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
    </form>
    <div class="err" id="login-err"></div>
  </section>

  <section id="view" hidden></section>
</main>

<div id="player" hidden>
  <button id="player-close" aria-label="Schließen">×</button>
  <video id="video" controls autoplay playsinline></video>
  <div id="player-title"></div>
</div>

<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>MovieBox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar" hidden>
  <h1>MovieBox</h1>
  <nav>
    <button data-view="home" class="tab active">Start</button>
    <button data-view="movies" class="tab">Filme</button>
    <button data-view="shows" class="tab">Serien</button>
    <button data-view="discover" class="tab">Entdecken</button>
  </nav>
  <div class="search">
    <input id="search-input" type="search" placeholder="Suchen …" aria-label="Suchen">
  </div>
  <div class="actions">
    <button id="random-btn" title="Zufall">🎲</button>
    <button id="favorites-btn" title="Lieblinge">❤</button>
    <button id="watchlists-btn" title="Listen">☰</button>
    <button id="url-btn" title="URL hinzufügen">+</button>
    <button id="upload-btn" title="Hochladen">⬆</button>
    <button id="scan-btn" title="Jetzt scannen">↻</button>
    <button id="admin-btn" title="Admin">⚙</button>
    <button id="logout-btn" title="Abmelden">⎋</button>
  </div>
</header>

<main id="app">
  <section id="login">
    <h1>MovieBox</h1>
    <p>Anmelden</p>
    <form id="login-form">
      <input id="u" name="username" placeholder="Benutzername" autocomplete="username" required>
      <input id="p" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
    </form>
    <div class="err" id="login-err"></div>
  </section>

  <section id="view" hidden></section>
</main>

<div id="player" hidden>
  <button id="player-close" aria-label="Schließen">×</button>
  <video id="video" controls autoplay playsinline></video>
  <div id="player-title"></div>
</div>

<div id="modal" hidden>
  <div class="modal-card">
    <button class="modal-close" aria-label="Schließen">×</button>
    <div class="modal-body"></div>
  </div>
</div>

<div id="drop-overlay" hidden><div>Datei hier ablegen</div></div>
<div id="toast" hidden></div>

<input id="file-picker" type="file" accept="video/*,.mkv,.mp4,.m4v,.mov,.avi,.ts,.m2ts,.webm" multiple hidden>

<script src="app.js"></script>
</body>
</html>

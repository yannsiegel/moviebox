name: Android APK

on:
  push:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: app
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease 2>&1 | tee build.log; then
            # show the compiler errors on the run's summary page
            grep -E -A12 '^e: |What went wrong|error:|FAILED' build.log | grep -v '^> Task' | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > errors.txt
            echo "::error title=Build failed::$(cat errors.txt)"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../MovieBox.apk
      # The newest APK is always on the repository's "Releases" page, easy to open on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MovieBox ${{ github.run_number }}
          make_latest: true
          files: MovieBox.apk
